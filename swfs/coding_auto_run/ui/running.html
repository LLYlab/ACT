<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>进行中</title>
<style>
  body{display:flex;flex-direction:column;height:100%}
  .wrap{flex:1;min-height:0;overflow:auto;max-width:820px;margin:0 auto;
        padding:34px 30px 56px;width:100%}
  .lead{font-size:22px;font-weight:660;letter-spacing:-.022em;margin:0 0 8px}
  .say{color:var(--llmr-muted);font-size:13px;margin:0 0 26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--llmr-mono);font-size:10px;font-weight:600;
        letter-spacing:.14em;text-transform:uppercase;color:var(--llmr-muted2);margin:0 0 7px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:22px}

  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;
        border:1px solid transparent;transition:all .3s ease}
  .steps li .dot{width:7px;height:7px;border-radius:50%;background:#243044;flex:none;
        transition:all .3s ease}
  .steps li .nm{font-family:var(--llmr-mono);font-size:12.5px;color:var(--llmr-muted)}
  .steps li .zh{flex:1;font-size:13.5px;color:var(--llmr-muted2)}
  .steps li.done{background:rgba(76,201,240,.06);border-color:rgba(76,201,240,.16)}
  .steps li.done .dot{background:var(--llmr-accent);box-shadow:0 0 8px var(--llmr-accent-glow)}
  .steps li.done .nm{color:var(--llmr-accent)}
  .steps li.done .zh{color:var(--llmr-fg2)}
  .steps li.now{border-color:rgba(76,201,240,.34);background:rgba(76,201,240,.08)}
  .steps li.now .dot{background:var(--llmr-accent);animation:bl 1.1s ease-in-out infinite}
  .steps li.now .zh{color:var(--llmr-fg)}
  @keyframes bl{50%{opacity:.32}}
  .nums{display:flex;gap:26px;margin:22px 0 4px}
  .nums div{font-family:var(--llmr-mono)}
  .nums b{display:block;font-size:23px;font-weight:660;color:var(--llmr-fg);letter-spacing:-.02em}
  .nums span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--llmr-muted2)}
  .ask{margin-top:22px;padding:18px 20px;border-radius:var(--llmr-r);
        background:var(--llmr-panel2);border:1px solid rgba(76,201,240,.2);
        border-left:2px solid var(--llmr-accent)}
  .hide{display:none}
  .sec{position:absolute;left:0;right:0;bottom:0;padding:9px 16px;font-size:12px;
        font-family:var(--llmr-mono);color:var(--llmr-muted2);
        border-top:1px solid var(--llmr-line2);background:rgba(10,14,21,.75)}

</style>
</head>
<body>

<div class="wrap">
  <p class="lead" id="lead">正在做</p>
  <p class="say">你看不到源码是**故意的**——要看，去「审阅」页展开。这里只报进度。</p>

  <div class="llmr-card">
    <ul class="steps" id="steps"></ul>
    <div class="nums">
      <div><b id="nFiles">—</b><span>改动文件</span></div>
      <div><b id="nRounds">0</b><span>自愈轮次</span></div>
      <div><b id="nSteps">0</b><span>已走步骤</span></div>
    </div>
  </div>

  <div class="ask hide" id="ask">
    <div id="askQ" style="margin-bottom:12px"></div>
    <textarea id="askA" rows="3" placeholder="回答它…"></textarea>
    <div class="actions">
      <button class="llmr-btn primary" id="askGo">回答并继续</button>
      <span class="llmr-hint">答完它接着往下走</span>
    </div>
  </div>
</div>
<div class="sec" id="sec">待开始</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }
  var Z = { recv_goal: '接管', recon: '只读侦察', clarify: '需要你一句',
            plan: '出计划', implement: '施工', verify: '构建自检',
            summarize: '收尾', diagnose: '自愈·诊断', patch: '自愈·修',
            give_up: '计划阶段叫停', abort: '中止' }
  var ORDER = ['recv_goal', 'recon', 'clarify', 'plan', 'implement', 'verify', 'summarize']
  var POOLNAME = { self_heal: '环控·自愈' }
  var done = {}, cur = null, files = 0, rounds = 0, steps = 0, pause = null

  function paint () {
    var html = ORDER.map(function (id) {
      var cls = done[id] ? 'done' : (id === cur ? 'now' : '')
      return '<li class="' + cls + '" data-id="' + id + '">' +
        '<span class="dot"></span>' +
        '<span class="nm">' + id + '</span>' +
        '<span class="zh">' + (Z[id] || id) + '</span></li>'
    }).join('')
    $('#steps').innerHTML = html
    $('#nFiles').textContent = files || '—'
    $('#nRounds').textContent = rounds
    $('#nSteps').textContent = steps
    $('#lead').textContent = done.summarize ? '搞好了' : (cur ? '正在：' + (Z[cur] || cur) : '正在做')
    $('#sec').textContent = cur ? ('执行中 · ' + cur + (pause ? ' · 等你回答' : '')) : '待开始'
  }

  function apply (s) {
    if (!s || typeof s.amz !== 'string') return
    steps++
    if (s.signal && typeof s.signal.file_count === 'number' && s.signal.file_count > 0) files = s.signal.file_count
    if (s.pool) { rounds = Math.max(rounds, s.round || 0); cur = s.amz; }
    else if (s.to || s.status) { done[s.amz] = true; cur = (s.to && ORDER.indexOf(s.to) >= 0) ? s.to : null }
    paint()
  }

  function showAsk (q) {
    pause = q
    $('#ask').classList.remove('hide')
    $('#askQ').textContent = q.question
    $('#askA').focus()
    paint()
  }

  $('#askGo').onclick = function () {
    var t = $('#askA').value.trim()
    if (!t) { $('#askA').focus(); return }
    $('#ask').classList.add('hide')
    $('#askGo').disabled = true
    llmr.resume(pause.next, t).catch(function (e) {
      $('#askGo').disabled = false
      $('#sec').textContent = String(e && e.message ? e.message : e)
    })
  }

  llmr.on('step', apply)
  llmr.on('pause', showAsk)
  llmr.on('done', function () { cur = 'summarize'; done.summarize = true; pause = null; paint() })
  llmr.on('error', function (d) {
    $('#sec').textContent = '出错了：' + ((d && d.message) || '未知')
    $('#sec').style.color = 'var(--llmr-danger)'
  })

  llmr.ready().then(function (st) {
    var tr = (st && st.trace) || []
    for (var i = 0; i < tr.length; i++) apply(tr[i])
    if (!tr.length) { cur = 'recv_goal'; paint() }
  }).catch(function () { cur = 'recv_goal'; paint() })
})()
</script>
</body>
</html>

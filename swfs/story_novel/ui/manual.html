<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>亲自编辑</title>
<style>
  body{display:flex;flex-direction:column;height:100%}
  .wrap{flex:1;min-height:0;overflow:auto;padding:26px 30px 56px;width:100%}
  .wrap.mid{max-width:880px;margin:0 auto}
  .lead{font-size:21px;font-weight:660;letter-spacing:-.02em;margin:0 0 8px}
  .say{color:var(--llmr-muted);font-size:13px;margin:0 0 22px}
  label.f{display:block;font-family:var(--llmr-mono);font-size:10px;font-weight:600;
        letter-spacing:.14em;text-transform:uppercase;color:var(--llmr-muted2);margin:15px 0 7px}
  .actions{display:flex;gap:9px;align-items:center;margin-top:18px;flex-wrap:wrap}

  .wrap{display:flex;flex-direction:column}
  .ed{flex:1;min-height:320px;background:var(--llmr-soft);border:1px solid var(--llmr-line);
      border-radius:var(--llmr-r);padding:18px 20px;font-family:var(--llmr-mono);font-size:13.5px;
      line-height:1.85;resize:none}
  .banner{background:var(--llmr-panel2);border:1px solid var(--llmr-line);
      border-left:2px solid var(--llmr-accent3);border-radius:var(--llmr-r);
      padding:12px 16px;font-size:12.5px;color:var(--llmr-fg2);margin-bottom:16px}

</style>
</head>
<body>

<div class="wrap mid">
  <div class="banner"><b>AI 已退到后台。</b>这一页就是你的编辑器——流程不介入、不改你的字。<br>
    只有「保存」会碰文件。</div>

  <div style="display:flex;gap:12px">
    <div style="width:230px;flex:none">
      <label class="f" style="margin-top:0">文件</label>
      <input id="file" class="llmr-input" type="text" placeholder="章节/第003章.md">
    </div>
    <div style="flex:1;display:flex;align-items:flex-end;gap:9px">
      <button class="llmr-btn" id="load">打开</button>
      <button class="llmr-btn primary" id="save">保存</button>
      <button class="llmr-btn" id="back">回到编辑渲染</button>
      <span class="llmr-hint" id="msg"></span>
    </div>
  </div>

  <label class="f">正文</label>
  <textarea class="ed" id="ed" spellcheck="false"></textarea>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }

  var msg = $('#msg')
  $('#load').onclick = function () {
    var f = $('#file').value.trim(); if (!f) return
    llmr.fs.read(f).then(function (r) {
      $('#ed').value = (r && r.text) || ''
      msg.textContent = (r && r.text === null) ? '没有这个文件（保存即新建）' : ''
    }).catch(function (e) { msg.textContent = String(e.message || e) })
  }
  $('#save').onclick = function () {
    var f = $('#file').value.trim(); if (!f) { $('#file').focus(); return }
    llmr.fs.write(f, $('#ed').value).then(function () { msg.textContent = '已保存' })
      .catch(function (e) { msg.textContent = String(e.message || e) })
  }
  $('#back').onclick = function () { llmr.screen('edit_render') }

})()
</script>
</body>
</html>

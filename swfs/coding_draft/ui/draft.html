<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>草稿</title>
<style>
  body{display:flex;flex-direction:column;height:100%}
  .wrap{flex:1;min-height:0;overflow:auto;padding:28px 30px 56px;width:100%}
  .wrap.mid{max-width:820px;margin:0 auto}
  .lead{font-size:21px;font-weight:660;letter-spacing:-.02em;margin:0 0 8px}
  .say{color:var(--llmr-muted);font-size:13px;margin:0 0 24px}
  label.f{display:block;font-family:var(--llmr-mono);font-size:10px;font-weight:600;
        letter-spacing:.14em;text-transform:uppercase;color:var(--llmr-muted2);margin:16px 0 7px}
  .actions{display:flex;gap:9px;align-items:center;margin-top:20px;flex-wrap:wrap}

  .syn{background:var(--llmr-soft);border:1px solid var(--llmr-line2);border-radius:var(--llmr-r);
      padding:16px 18px;font-family:var(--llmr-mono);font-size:12.5px;line-height:1.8;
      white-space:pre;overflow:auto;color:var(--llmr-fg2)}
  .syn b{color:var(--llmr-accent);font-weight:600}
  .syn i{color:var(--llmr-warn);font-style:normal}

</style>
</head>
<body>

<div class="wrap mid">
  <p class="lead">写下你的壳和指令</p>
  <p class="say">在文件里写 <b class="llmr-mono">AI: 指令</b> 和 <b class="llmr-mono">/AIfin</b>，它把每一段补成真代码——<b>保留你的壳，只填肉</b>。</p>

  <div class="syn">struct Channel {
    <i>AI:impl:</i> 给老子搞一个通用接口，内容你自己想
    <i>/AIfin</i>
};</div>

  <label class="f">目标文件或目录</label>
  <input id="target" class="llmr-input" type="text" placeholder="src/channel.ts" autocomplete="off">

  <label class="f">策略（可选）</label>
  <input id="strategy" class="llmr-input" type="text" placeholder="impl 从零实现 / fix 修 / doc 写文档" autocomplete="off">

  <div class="actions">
    <button class="llmr-btn primary" id="go">扫一遍</button>
    <span class="llmr-hint" id="msg"></span>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }

  var msg = $('#msg'), btn = $('#go')
  llmr.ready().then(function (st) {
    var a = (st && st.args) || {}
    if (a.target) $('#target').value = a.target
    if (a.strategy) $('#strategy').value = a.strategy
  }).catch(function () {})
  btn.onclick = function () {
    var t = $('#target').value.trim()
    if (!t) { $('#target').focus(); return }
    btn.disabled = true; msg.textContent = '正在扫…'
    var args = { target: t }
    if ($('#strategy').value.trim()) args.strategy = $('#strategy').value.trim()
    llmr.run(args).then(function () { llmr.screen('fill') })
      .catch(function (e) { btn.disabled = false; msg.textContent = String(e.message || e) })
  }

})()
</script>
</body>
</html>

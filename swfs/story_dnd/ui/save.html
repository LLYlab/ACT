<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>存档</title>
<style>
  body{display:flex;flex-direction:column;height:100%}
  .wrap{flex:1;min-height:0;overflow:auto;padding:26px 30px 56px;width:100%}
  .wrap.mid{max-width:880px;margin:0 auto}
  .lead{font-size:21px;font-weight:660;letter-spacing:-.02em;margin:0 0 8px}
  .say{color:var(--llmr-muted);font-size:13px;margin:0 0 22px}
  label.f{display:block;font-family:var(--llmr-mono);font-size:10px;font-weight:600;
        letter-spacing:.14em;text-transform:uppercase;color:var(--llmr-muted2);margin:15px 0 7px}
  .actions{display:flex;gap:9px;align-items:center;margin-top:18px;flex-wrap:wrap}

  .card{background:var(--llmr-panel);border:1px solid var(--llmr-line);border-radius:var(--llmr-r);
      padding:18px 20px;white-space:pre-wrap;word-break:break-word;line-height:1.8;font-size:13.5px;
      color:var(--llmr-fg2)}
  .card:empty::before{content:'（还没有存档）';color:var(--llmr-muted)}

</style>
</head>
<body>

<div class="wrap mid">
  <p class="lead">存档</p>
  <p class="say">状态落在工作区里。<b>不写回就等于这一回合没发生。</b></p>

  <label class="f">状态</label>
  <div class="card" id="state"></div>

  <label class="f">事件日志</label>
  <div class="card" id="log"></div>

  <div class="actions">
    <button class="llmr-btn primary" id="back">回到跑团</button>
    <button class="llmr-btn" id="reload">刷新</button>
    <span class="llmr-hint" id="msg"></span>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }

  function rd (p) { return llmr.fs.read(p).then(function (r) { return (r && r.text) || '' }).catch(function () { return '' }) }
  function load () {
    Promise.all([rd('存档/状态.md'), rd('存档/日志.md')]).then(function (v) {
      $('#state').textContent = v[0] || ''
      $('#log').textContent = v[1] || ''
    })
  }
  $('#reload').onclick = load
  $('#back').onclick = function () { llmr.screen('play') }
  load()

})()
</script>
</body>
</html>

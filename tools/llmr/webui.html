<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM R</title>
<style>
  :root{
    /* 底色：带冷调的近黑。整体只做暗色——一个 runtime 控制台就该长这样 */
    --bg:#070a10; --panel:#0c1119; --panel2:#111823; --panel3:#161e2b;
    --fg:#e8eef7; --fg2:#a3b2c7; --muted:#63748c; --muted2:#4a586b;
    --line:#1a2432; --line2:#141c27; --soft:#0f1620; --soft2:#161f2b;
    --accent:#4cc9f0; --accent2:#7b61ff; --accent3:#2ee6c5;
    --accent-soft:rgba(76,201,240,.12); --accent-glow:rgba(76,201,240,.45);
    --accent-fg:#04121a;
    --danger:#ff5d6c; --warn:#f5b544; --ok:#38e08b;
    --sh-xs:0 1px 1px rgba(0,0,0,.5);
    --sh-sm:0 1px 2px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.02) inset;
    --sh-md:0 2px 6px rgba(0,0,0,.5), 0 16px 40px -12px rgba(0,0,0,.75);
    --sh-lg:0 2px 10px rgba(0,0,0,.55), 0 40px 90px -24px rgba(0,0,0,.9);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
    --r:10px; --r-lg:14px; --r-sm:7px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;overflow:hidden;
       -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

  /* 背景：细网格 + 两团冷光。压在最底层，不挡交互 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
       background-image:
         linear-gradient(rgba(76,201,240,.05) 1px,transparent 1px),
         linear-gradient(90deg,rgba(76,201,240,.05) 1px,transparent 1px);
       background-size:46px 46px;
       -webkit-mask-image:radial-gradient(130% 95% at 50% -5%,#000 18%,transparent 76%);
       mask-image:radial-gradient(130% 95% at 50% -5%,#000 18%,transparent 76%)}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
       background:
         radial-gradient(920px 430px at 14% -10%,rgba(76,201,240,.15),transparent 62%),
         radial-gradient(780px 400px at 94% 2%,rgba(123,97,255,.13),transparent 60%)}

  button,input,textarea,select{font:inherit;color:inherit}
  ::selection{background:rgba(76,201,240,.28)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1e2836;border-radius:6px;border:3px solid transparent;
       background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#2c3a4d;background-clip:content-box}

  header{position:relative;z-index:3;flex:none;display:flex;align-items:center;gap:18px;
         padding:0 20px;height:56px;background:rgba(10,14,21,.82);
         backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
         border-bottom:1px solid var(--line)}
  header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
         background:linear-gradient(90deg,transparent,rgba(76,201,240,.5) 18%,rgba(123,97,255,.45) 55%,transparent);
         opacity:.62}
  .brand{display:flex;align-items:center;gap:11px;font-weight:680;font-size:15px;letter-spacing:.005em}
  .brand .mark{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
         background:linear-gradient(145deg,#123040,#1a1a3d);
         border:1px solid rgba(76,201,240,.34);
         box-shadow:0 0 0 1px rgba(76,201,240,.07),0 4px 16px -4px rgba(76,201,240,.45)}
  .brand .name{display:flex;align-items:baseline;gap:7px}
  .brand .r{background:linear-gradient(100deg,var(--accent),var(--accent2));
         -webkit-background-clip:text;background-clip:text;color:transparent;
         font-weight:800;letter-spacing:.01em}
  .brand .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);
         text-transform:uppercase;font-weight:500;padding-top:1px}
  .seg{display:flex;gap:2px;padding:3px;background:var(--soft);border:1px solid var(--line2);
       border-radius:9px}
  .seg button{border:0;background:transparent;padding:5px 15px;border-radius:6px;cursor:pointer;
       color:var(--muted);font-size:12.5px;font-weight:500;transition:all .16s ease}
  .seg button.on{background:var(--panel3);color:var(--fg);font-weight:600;
       box-shadow:0 0 0 1px rgba(76,201,240,.18),0 1px 3px rgba(0,0,0,.5)}
  .grow{flex:1}

  .btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 14px;
       cursor:pointer;font-size:13px;font-weight:500;color:var(--fg2);
       transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
  .btn:hover{background:var(--panel3);color:var(--fg);border-color:#243146}
  .btn.primary{background:linear-gradient(180deg,rgba(76,201,240,.95),rgba(58,168,214,.95));
       color:var(--accent-fg);border-color:transparent;font-weight:650;
       box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 22px -8px var(--accent-glow)}
  .btn.primary:hover{filter:brightness(1.09);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 28px -8px var(--accent-glow)}
  .btn.plain{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
  .btn.plain:hover{background:var(--soft2);color:var(--fg)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.ghost:hover{background:var(--soft2);color:var(--fg)}

  main{position:relative;z-index:1;flex:1;display:flex;min-height:0}
  aside{width:268px;flex:none;background:rgba(9,13,19,.72);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0;
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  aside .scroll{flex:1;overflow:auto;padding:12px}
  aside .foot{flex:none;padding:12px;border-top:1px solid var(--line2)}
  section{flex:1;min-width:0;overflow:auto}

  .newbtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
       padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
       cursor:pointer;font-weight:600;font-size:13.5px;color:var(--fg);transition:all .18s ease}
  .newbtn:hover{border-color:rgba(76,201,240,.5);color:var(--accent);background:var(--panel3);
       box-shadow:0 6px 22px -10px var(--accent-glow)}
  .newbtn .plus{font-size:15px;line-height:1}

  .side-h{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;
          text-transform:uppercase;color:var(--muted2);margin:20px 10px 8px}
  .row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;font-size:13.5px;
       cursor:pointer;margin-bottom:1px;transition:background .14s ease;border:1px solid transparent}
  .row:hover{background:var(--soft2)}
  .row.on{background:var(--accent-soft);border-color:rgba(76,201,240,.24);font-weight:600;
       color:var(--accent)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--muted);
          padding:0 3px;border-radius:5px;font-size:15px;line-height:1;transition:opacity .14s ease}
  .row:hover .x{opacity:.75}
  .row .x:hover{color:var(--danger)}
  .side-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:22px 12px;line-height:1.8}
  .side-empty .ic{font-size:20px;opacity:.35;display:block;margin-bottom:6px}
  .sidefoot{color:var(--muted);font-size:11.5px;text-align:center;line-height:2}
  .sidefoot a{color:var(--accent);text-decoration:none;cursor:pointer}
  .sidefoot a:hover{text-decoration:underline}

  /* ── 首页 ── */
  .hero{min-height:100%;display:flex;flex-direction:column;align-items:center;
        padding:min(15vh,130px) 28px 64px;text-align:center}
  .hero .greet{font-size:clamp(24px,3vw,34px);font-weight:660;letter-spacing:-.028em;
        margin:0 0 12px;line-height:1.2;
        background:linear-gradient(180deg,#fff,#96a8bf);-webkit-background-clip:text;
        background-clip:text;color:transparent}
  .hero .sub{color:var(--muted);font-size:14px;margin:0 0 32px}
  .askbox{width:min(660px,100%);text-align:left}
  .askbox .box{display:flex;align-items:center;gap:10px;background:var(--panel2);
        border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 20px;
        box-shadow:var(--sh-md);transition:border-color .18s ease,box-shadow .18s ease}
  .askbox .box:focus-within{border-color:rgba(76,201,240,.55);
        box-shadow:0 0 0 4px rgba(76,201,240,.09),0 10px 34px -14px var(--accent-glow)}
  .askbox input{flex:1;border:0;background:transparent;outline:none;font-size:15px;padding:11px 0}
  .askbox input::placeholder{color:var(--muted2)}
  .askbox .send{width:40px;height:40px;flex:none;border:0;border-radius:10px;cursor:pointer;
        background:linear-gradient(180deg,rgba(76,201,240,.95),rgba(58,168,214,.95));
        color:var(--accent-fg);font-size:16px;display:grid;place-items:center;
        transition:filter .16s ease,box-shadow .16s ease;
        box-shadow:0 6px 20px -8px var(--accent-glow)}
  .askbox .send:hover{filter:brightness(1.1)}
  .askbox .send:disabled{opacity:.3;cursor:default;filter:none;box-shadow:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;width:min(660px,100%)}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--fg2);
        border-radius:8px;padding:6px 14px;font-size:12.5px;cursor:pointer;
        font-family:var(--mono);transition:all .16s ease}
  .chip:hover{border-color:rgba(76,201,240,.5);color:var(--accent);background:var(--panel3)}

  /* ── 确认卡 ── */
  .confirm{width:min(580px,100%);text-align:left;background:var(--panel2);border:1px solid var(--line);
        border-radius:var(--r-lg);padding:26px 28px;box-shadow:var(--sh-lg)}
  .confirm .lead{font-size:16.5px;font-weight:650;margin:0 0 6px;letter-spacing:-.014em}
  .confirm .said{color:var(--muted);font-size:13px;margin:0 0 22px;word-break:break-word}
  .pick{display:flex;align-items:center;gap:13px;background:var(--soft);border:1px solid var(--line2);
        border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
  .pick .ic{width:36px;height:36px;flex:none;border-radius:10px;background:var(--panel3);
        border:1px solid rgba(76,201,240,.24);display:grid;place-items:center;font-size:15px;
        color:var(--accent)}
  .pick .t{flex:1;min-width:0}
  .pick .t b{display:block;font-weight:620;font-size:13.5px}
  .pick .t span{color:var(--muted);font-size:12.5px}
  .confirm .actions{display:flex;gap:10px;align-items:center;margin-top:22px}

  label.f{display:block;margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);
        font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;
        border:1px solid var(--line);border-radius:9px;background:var(--soft);outline:none;
        transition:border-color .16s ease,box-shadow .16s ease;font-size:13.5px;color:var(--fg)}
  input::placeholder,textarea::placeholder{color:var(--muted2)}
  input:focus,textarea:focus,select:focus{border-color:rgba(76,201,240,.55);
        box-shadow:0 0 0 3px rgba(76,201,240,.09)}
  textarea{min-height:64px;font-family:var(--mono);font-size:12.5px;resize:vertical}

  /* ── 内容页 ── */
  .page{max-width:1000px;margin:0 auto;padding:36px 38px 80px}
  .title{font-size:23px;font-weight:660;letter-spacing:-.024em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 20px;word-break:break-all;font-family:var(--mono)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
        padding:22px 24px;margin-bottom:16px;box-shadow:var(--sh-sm)}
  .card.flush{padding:0;overflow:hidden}
  .h2{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;
      text-transform:uppercase;color:var(--muted2);margin:30px 0 10px;
      display:flex;align-items:center;gap:9px}
  .h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .card .h2:first-child{margin-top:0}
  .hint{color:var(--muted);font-size:12.5px}
  .empty{color:var(--muted);text-align:center;padding:90px 20px;line-height:1.9}
  .pill{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--soft);
        border:1px solid var(--line2);color:var(--fg2);font-size:11.5px;margin:0 6px 6px 0;
        font-family:var(--mono)}
  .pill.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(76,201,240,.24)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:rgba(76,201,240,.025)}
  th{color:var(--muted2);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
     font-family:var(--mono)}
  .mono{font-family:var(--mono);font-size:12.5px}
  ul.tree{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12.5px}
  ul.tree li{padding:2px 0}
  .edge{color:var(--muted)}
  .e-err{color:var(--danger)} .e-warn{color:var(--warn)} .e-ok{color:var(--ok)}
  .note{border-left:2px solid var(--accent);background:var(--soft);padding:11px 15px;
        border-radius:0 8px 8px 0;font-size:13px}

  /* ── 执行轨迹：一行流动的胶囊（图渲染不了时的兜底）── */
  .flow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
        display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px;box-shadow:var(--sh-sm)}
  .flow .chip{font-family:var(--mono);font-size:12px;font-weight:600;
        background:var(--soft2);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;
        white-space:nowrap;cursor:default}
  .flow .chip:hover{border-color:var(--line)}
  .flow .chip.last{background:var(--accent-soft);color:var(--accent);border-color:rgba(76,201,240,.3)}
  .flow .arw{color:var(--muted2);font-size:12px}
  .flow .arw.alt{color:var(--warn);font-weight:600}
  .flow .arw.pause{color:var(--accent);font-weight:600}
  .flow .arw.end{color:var(--ok)}

  /* ── 调用图（SVG）── */
  .graph{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:auto;
        background:
          radial-gradient(720px 300px at 30% 0%,rgba(76,201,240,.055),transparent 68%),
          var(--panel);
        box-shadow:var(--sh-sm)}
  .graph svg{display:block}
  .g-edge{fill:none;stroke:#243044;stroke-width:1.3;transition:stroke .3s ease}
  .g-edge.else{stroke-dasharray:4 4;stroke:#5c4a22}
  .g-edge.done{stroke:var(--accent);stroke-width:1.7}
  .g-edge.done.else{stroke:var(--warn);stroke-dasharray:4 4}
  .g-edge.flow{stroke-dasharray:5 7;animation:gflow 1.05s linear infinite}
  @keyframes gflow{to{stroke-dashoffset:-24}}
  .g-node rect{fill:var(--panel2);stroke:#22303f;stroke-width:1;transition:all .3s ease}
  .g-node:hover rect{fill:var(--panel3);stroke:#31435a}
  .g-node .nid{fill:var(--fg2);font-family:var(--mono);font-size:11.5px;font-weight:600}
  .g-node .kind{fill:var(--muted2);font-family:var(--mono);font-size:9px;font-weight:500}
  .g-node .ntag{fill:var(--muted2);font-family:var(--mono);font-size:9px}
  .g-node .dot{fill:#22303f;transition:fill .3s ease}
  .g-node.entry rect{stroke:rgba(76,201,240,.45)}
  .g-node.terminal rect{stroke-dasharray:3 3;stroke:#2c3a4d}
  .g-node.done rect{fill:rgba(76,201,240,.09);stroke:var(--accent)}
  .g-node.done .nid{fill:var(--accent)}
  .g-node.done .dot{fill:var(--accent);filter:drop-shadow(0 0 4px var(--accent-glow))}
  .g-node.paused .dot{filter:drop-shadow(0 0 4px rgba(245,181,68,.6))}
  .g-node.done rect{filter:drop-shadow(0 0 8px rgba(76,201,240,.14))}
  .g-node.paused rect{fill:rgba(245,181,68,.1);stroke:var(--warn)}
  .g-node.paused .nid{fill:var(--warn)}
  .g-node.paused .dot{fill:var(--warn)}
  .g-labbg{fill:#0c1119;opacity:.94}
  .g-lab{fill:var(--muted2);font-family:var(--mono);font-size:9.5px}
  .g-lab.else{fill:#8a6a2c}
  .g-lab.on{fill:var(--accent)}
  .g-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:10px;
        font-family:var(--mono);font-size:11px;color:var(--muted2)}
  .g-legend i{display:inline-block;width:18px;height:2px;border-radius:2px;margin-right:6px;
        vertical-align:middle;background:#243044}
  .g-legend i.else{background:repeating-linear-gradient(90deg,#5c4a22 0 4px,transparent 4px 8px)}
  .g-legend i.done{background:var(--accent)}
  .g-legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;
        vertical-align:middle;background:var(--panel2);border:1px solid #22303f}
  .g-legend b.done{background:rgba(76,201,240,.16);border-color:var(--accent)}
  .g-legend b.pause{background:rgba(245,181,68,.16);border-color:var(--warn)}
  .g-legend b.term{border-style:dashed}

  .out{background:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:16px 18px;
       white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px}
  /* 成品：像一张纸，而不是一段日志 */
  .paper{background:linear-gradient(180deg,#0f1620,#0c1119);border:1px solid var(--line);
         border-radius:var(--r);padding:28px 32px;white-space:pre-wrap;word-break:break-word;
         line-height:1.78;font-size:14px;box-shadow:var(--sh-md);max-width:76ch;position:relative}
  .paper::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
         background:linear-gradient(90deg,transparent,rgba(76,201,240,.4),transparent)}
  .ask{background:var(--panel2);border:1px solid rgba(76,201,240,.2);border-left:2px solid var(--accent);
       border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);margin-bottom:16px}
  .ask .q{font-size:14.5px;line-height:1.65;margin-bottom:14px}
  .ask textarea{margin-bottom:10px}
  .ask-btns{display:flex;gap:9px}
  /* 跑起来之后把表单收掉，让结果顶到眼前 */
  .foldline{display:none;align-items:center;gap:10px;margin:0 0 16px;font-size:12.5px;color:var(--muted)}
  .foldline #foldSum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
       color:var(--fg2);font-family:var(--mono)}
  .card.folded .fields{display:none}
  .card.folded .foldline{display:flex}
  .rowline{display:flex;align-items:center;gap:12px}
  .rowline .btn{flex:none}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;
       background:var(--panel3);color:var(--fg);border:1px solid var(--line);
       padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:var(--sh-lg);
       opacity:0;pointer-events:none;transition:opacity .2s ease}
  .toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h5.5M4 12h9M4 18h5.5" stroke="#4cc9f0" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="6" r="2.2" stroke="#4cc9f0" stroke-width="1.6"/><circle cx="17.5" cy="18" r="2.2" stroke="#7b61ff" stroke-width="1.6"/><path d="M9.5 12h4.2M17.5 8.2v7.6" stroke="#2ee6c5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 2"/></svg></span><span class="name">LLM <span class="r">R</span><span class="tag">Light Model Runtime</span></span></div>
  <div class="seg" id="modes">
    <button data-mode="user">用户</button>
    <button data-mode="dev">开发者</button>
  </div>
  <span class="grow"></span>
  <button class="btn plain" id="btnSettings"><span style="opacity:.65">⚙</span> 设置</button>
</header>

<main>
  <aside>
    <div class="scroll" id="side"></div>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <section id="view"></section>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s) }
  var S = { mode: 'user', settings: {}, agts: [], index: [], list: null,
            agt: null, view: null, swfPath: null, panel: null, creating: false, draft: null, lastTrace: null,
            // 开发者模式下的「试跑」：主区换成运行表单，侧栏仍然是 SWF 列表（作者要能来回切）
            devRun: false }

  function esc (v) {
    return String(v === undefined || v === null ? '' : v)
      .replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] })
  }
  function dash (v) { return esc(v === undefined || v === null || v === '' ? '—' : v) }
  function toast (m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on') }, 1900) }

  function api (p, opt) {
    return fetch(p, Object.assign({ cache: 'no-store' }, opt || {})).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: 'HTTP ' + r.status } })
    })
  }
  function post (p, body, method) {
    return api(p, { method: method || 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
  }
  function dirQ () { return S.settings.dir ? '&dir=' + encodeURIComponent(S.settings.dir) : '' }

  function boot () {
    return api('/api/settings').then(function (r) {
      S.settings = (r && r.settings) || {}
      S.mode = S.settings.mode === 'dev' ? 'dev' : 'user'
      return Promise.all([refreshList(), refreshAgts(), refreshIndex()])
    }).then(applyHash).then(paint)
  }

  // 深链： #dev · #swf=<path> · #agt=<id>
  // 既方便收藏，也让无头渲染能直接落到某个视图。
  function applyHash () {
    var h = String(location.hash || '').replace(/^#/, '')
    if (!h) return
    var p = new URLSearchParams(h)
    var sw = p.get('swf')
    var ag = p.get('agt')

    // ⚠ 深链要**压过存储的设置**：否则设置里存着 dev，`#agt=` 会落进开发者视图
    // （实测踩过：`#agt=<id>` 停在空的开发者视图，因为没显式切回用户模式）。
    if (sw) {
      S.mode = 'dev'; S.panel = null; S.swfPath = sw
      return api('/api/view?path=' + encodeURIComponent(sw) + dirQ()).then(function (v) { S.view = v })
    }
    if (ag) {
      S.mode = 'user'; S.panel = null
      return selectAgt(ag)
    }
    if (h === 'dev' || p.has('dev')) S.mode = 'dev'
  }
  function refreshList () {
    return api('/api/list' + (S.settings.dir ? '?dir=' + encodeURIComponent(S.settings.dir) : ''))
      .then(function (r) { S.list = r || { swfs: [], amz: [] } })
  }
  function refreshAgts () { return api('/api/agts').then(function (r) { S.agts = (r && r.agts) || [] }) }
  function refreshIndex () {
    return api('/api/index' + (S.settings.dir ? '?dir=' + encodeURIComponent(S.settings.dir) : ''))
      .then(function (r) { S.index = (r && r.items) || [] })
  }
  function saveSettings (patch) {
    return post('/api/settings', Object.assign({}, S.settings, patch)).then(function (r) {
      S.settings = (r && r.settings) || S.settings
      return S.settings
    })
  }

  function paint () {
    var ms = $('#modes').children
    for (var i = 0; i < ms.length; i++) ms[i].classList.toggle('on', ms[i].getAttribute('data-mode') === S.mode)
    if (S.panel === 'settings') return paintSettings()
    if (S.mode === 'dev') return paintDev()
    paintUser()
  }

  // ══════════ 用户模式 ══════════
  function paintUser () {
    var list = S.agts.length
      ? S.agts.map(function (a) {
        return '<div class="row' + (S.agt && S.agt.id === a.id && !S.creating ? ' on' : '') + '" data-agt="' + esc(a.id) + '">'
          + '<span class="nm">' + esc(a.name) + '</span>'
          + '<button class="x" data-del="' + esc(a.id) + '" title="删除">×</button></div>'
      }).join('')
      : '<div class="side-empty"><span class="ic">◇</span>还没有 AGT<br>下面开始第一个</div>'

    $('#side').innerHTML =
      '<button class="newbtn" id="btnNew"><span class="plus">＋</span> 新建 AGT</button>'
      + '<div class="side-h">我的 AGT</div>' + list
    $('#sideFoot').innerHTML = (S.settings.model && S.settings.model.hasKey)
      ? '<div class="sidefoot">LLM R · 独立运行</div>'
      : '<div class="sidefoot">未配置模型 API<br><a id="footSet">去设置</a></div>'
    var fset = $('#footSet')
    if (fset) fset.onclick = function () { S.panel = 'settings'; paint() }
    $('#btnNew').onclick = function () { S.creating = true; S.draft = null; S.agt = null; paint() }

    if (!S.creating && S.agt) return paintAgt()
    paintHero()
  }

  // ── 首页 ──
  function paintHero () {
    var chips = []
    S.index.forEach(function (it) { it.tags.forEach(function (t) { if (chips.indexOf(t) < 0) chips.push(t) }) })

    if (!S.draft) {
      $('#view').innerHTML = '<div class="hero">'
        + '<p class="greet">你需要什么帮助，朋友？</p>'
        + '<p class="sub">说一句你要做的事，我给你配一个 AGT。</p>'
        + '<div class="ask"><div class="box">'
        + '<input type="text" id="askInput" placeholder="例如：把资料整理成一份 Word">'
        + '<button class="send" id="askGo" title="开始">→</button>'
        + '</div>'
        + (chips.length ? '<div class="chips">' + chips.slice(0, 8).map(function (t) {
          return '<button class="chip" data-chip="' + esc(t) + '">' + esc(t) + '</button>'
        }).join('') + '</div>' : '')
        + '</div></div>'
      var inp = $('#askInput'); inp.focus()
      inp.onkeydown = function (e) { if (e.key === 'Enter') ask() }
      $('#askGo').onclick = ask
      return
    }

    var b = S.draft.best
    var lead = b ? (b.tags.length ? b.tags.join(' · ') + ' 类任务' : '这类任务') : '我不太确定这属于哪一类'
    $('#view').innerHTML = '<div class="hero"><div class="confirm">'
      + '<p class="lead">' + esc(lead) + '</p>'
      + '<p class="said">「' + esc(S.draft.text) + '」</p>'
      + (b
        ? '<div class="pick"><div class="ic">◆</div><div class="t"><b>' + esc(b.title || b.id || b.name) + '</b>'
          + '<span>' + esc(b.when || b.name) + '</span></div></div>'
        : '<div class="note e-warn" style="margin-bottom:20px">按关键词没匹配到合适的流程，你手动选一张 SWF。</div>')
      + '<label class="f">给它起个名字</label>'
      + '<input type="text" id="dfName" value="' + esc((b && (b.title || b.id)) || S.draft.text.slice(0, 14)) + '">'
      + '<label class="f">用哪张 SWF</label>'
      + '<select id="dfSwf">' + (S.list.swfs || []).map(function (s) {
          return '<option value="' + esc(s.path) + '"' + (b && s.path === b.path ? ' selected' : '') + '>' + esc(s.name) + '</option>'
        }).join('') + '</select>'
      + '<div class="actions"><button class="btn primary" id="dfOk">创建并开始</button>'
      + '<button class="btn plain" id="dfBack">再想想</button></div>'
      + '</div></div>'
    $('#dfName').onkeydown = function (e) { if (e.key === 'Enter') createAgt() }
    $('#dfOk').onclick = createAgt
    $('#dfBack').onclick = function () { S.draft = null; paint() }
  }

  function ask () {
    var v = $('#askInput').value.trim()
    if (!v) return
    var go = $('#askGo'); if (go) go.disabled = true
    api('/api/match?q=' + encodeURIComponent(v) + dirQ()).then(function (r) {
      S.draft = { text: v, best: (r && r.best) || null }
      paint()
    })
  }

  function createAgt () {
    var name = $('#dfName').value.trim(), swf = $('#dfSwf').value
    if (!name || !swf) { toast('名字和 SWF 都要有'); return }
    post('/api/agts', { name: name, swf: swf, purpose: S.draft ? S.draft.text : '' }).then(function (r) {
      if (!r.ok) { toast(r.error || '创建失败'); return }
      S.draft = null; S.creating = false
      return refreshAgts().then(function () { selectAgt(r.agt.id) })
    })
  }

  // ── 选中的 AGT ──
  function paintAgt () {
    var a = S.agt, swf = (S.view && S.view.swf) || {}, inv = swf.invoke || {}
    var argsDef = Array.isArray(inv.args) ? inv.args : []
    var h = '<div class="page">'
    h += '<p class="title">' + esc(a.name) + '</p>'
    // 试跑是从开发者视图进来的，得有条路回去（否则作者只能靠重新点左侧的 SWF）
    if (S.mode === 'dev' && S.devRun) {
      h += '<div class="rowline" style="margin:2px 0 10px"><button class="btn ghost sm" id="btnBackDev">← 返回校验视图</button>'
        + '<span class="hint">试跑不会改动声明；改完点左侧 SWF 名字刷新</span></div>'
    }
    h += '<p class="sub">' + (swf.title ? esc(swf.title) + ' · ' : '') + esc(inv.when || a.purpose || '') + '</p>'
    if (Array.isArray(inv.tags) && inv.tags.length) h += inv.tags.map(function (t) { return '<span class="pill">' + esc(t) + '</span>' }).join('')
    if (S.view && S.view.errors && S.view.errors.length) {
      h += '<div class="note e-err" style="margin-top:14px">这张 SWF 有 ' + S.view.errors.length + ' 个校验错误，可能跑不通。</div>'
    }
    h += '<div class="card" id="runCard" style="margin-top:20px"><div class="h2" style="margin-top:0">做什么</div>'
    // 跑起来之后表单要收起来。否则每跑一次，成品都被压在四个输入框下面，
    // 得往下滚才看得见——用户要的是**结果**，不是这张表。
    h += '<div class="foldline">跑的是：<span id="foldSum"></span>'
      + '<button class="btn ghost sm" id="btnFold">改</button></div>'
    h += '<div class="fields">'
    // ⚠ 诉求**永远**要有。以前是「有 args 就不给诉求框」——可真实流程往往两样都要：
    // 用户既要说清要干什么，又要指个文件。那个二选一让「把老师这段话贴进来」没地方贴。
    h += '<label class="f">诉求</label><input type="text" data-arg="__goal" placeholder="用一句话说清，或直接把他发的那段贴进来">'
    if (argsDef.length) {
      argsDef.forEach(function (d) {
        // 占位符给人看的提示，不是把类型名原样丢出来
        var hint = d.type === 'refs' ? '资料标号，如 1,2'
          : d.type === 'int' ? '数字'
          : d.type === 'bool' ? 'true / false'
          : '填写 ' + d.name
        h += '<label class="f">' + esc(d.name) + (d.required ? ' *' : '') + '</label>'
        h += '<input type="text" data-arg="' + esc(d.name) + '" placeholder="' + esc(hint) + '">'
      })
    }
    // echo 后端下可以喂样例正文。目的是**不花额度**就能看真实版式的成品长什么样、
    // 暂停与分支对不对。这不是模拟执行——走的是同一个执行器和同一套渲染，
    // 只是把「模型会产出什么」这一步先钉死。换成真后端它就不出现了。
    if (S.settings.backend === 'echo') {
      h += '<label class="f" style="margin-top:16px">样例输出（仅 echo 干跑用）</label>'
      h += '<textarea id="demoOut" rows="2" placeholder=\'{"show_result":"成品正文…"} —— 按 AMZ id 覆盖 echo 的正文\'></textarea>'
    }
    h += '</div>'
    h += '<div class="rowline" style="margin-top:20px"><button class="btn primary" id="btnRun">开始</button>'
      + '<span class="hint" id="runMsg"></span></div>'
    h += '</div>'
    h += '<div id="runBox"></div>'
    $('#view').innerHTML = h
    // ⚠ 必须包一层。直接 `= runAgt` 的话，点击事件会当成第一个参数传进去，
    // 于是 startAt 变成一个 PointerEvent —— 执行器报「节点不存在：[object PointerEvent]」。
    $('#btnRun').onclick = function () { runAgt() }
    $('#btnFold').onclick = function () { $('#runCard').classList.remove('folded'); $('input[data-arg=__goal]').focus() }
    var backDev = $('#btnBackDev')
    if (backDev) backDev.onclick = function () { S.devRun = false; S.agt = null; paint() }
  }

  function collectArgs () {
    var inputs = document.querySelectorAll('#view [data-arg]'), args = {}
    for (var i = 0; i < inputs.length; i++) {
      var k = inputs[i].getAttribute('data-arg'), v = inputs[i].value.trim()
      if (k === '__goal') { if (v) args.goal = v } else if (v) args[k] = v
    }
    return args
  }

  // 表单收起来，并在标题行留一句「跑的是：…」——既让结果露出头，又不会让人忘了输入的是什么
  function foldCard (args) {
    var card = $('#runCard'), sum = $('#foldSum')
    if (!card) return
    card.classList.add('folded')
    if (sum) {
      var bits = []
      if (args.goal) bits.push(args.goal)
      if (args.pdf) bits.push(args.pdf)
      sum.textContent = bits.length ? bits.join('　·　') : '(未填诉求)'
    }
  }

  function runAgt (startAt, confirmText) {
    var args = S.runArgs || collectArgs()
    S.runArgs = args
    var btn = $('#btnRun'), msg = $('#runMsg')
    var useHttp = S.settings.backend === 'http'
    if (!startAt && useHttp && !confirm('当前后端是 http —— 会真实调用模型并消耗额度。继续？')) return
    foldCard(args)
    if (btn) btn.disabled = true
    if (msg) msg.textContent = startAt ? '继续…' : (useHttp ? '调用模型中…' : '进行中…')
    var url = '/api/run?path=' + encodeURIComponent(S.agt.swf) + '&args=' + encodeURIComponent(JSON.stringify(args))
      + dirQ() + (useHttp ? '&backend=http' : '')
    if (startAt) url += '&startAt=' + encodeURIComponent(startAt)
    if (confirmText !== undefined) url += '&confirm=' + encodeURIComponent(confirmText)
    var dbg = $('#demoOut')
    if (dbg && dbg.value.trim()) {
      try { url += '&outputs=' + encodeURIComponent(JSON.stringify(JSON.parse(dbg.value))) } catch (e) { /* 不是 JSON 就当没填 */ }
    }
    api(url)
      .then(function (r) {
        if (btn) btn.disabled = false
        if (msg) msg.textContent = ''
        if (!r.trace) { $('#runBox').innerHTML = '<div class="e-err">' + esc(r.error || '失败') + '</div>'; return }
        // 暂停恢复是**两次调用**。只显示后一次的话，图上前几步永远是黑的——
    // 那几步是真跑过的，得拼起来。
    S.lastTrace = (startAt && Array.isArray(S.lastTrace)) ? S.lastTrace.concat(r.trace) : r.trace
        if (r.paused) paintPause(r)
        else paintResult(r)
        var box = $('#runBox')
        if (box && box.scrollIntoView) box.scrollIntoView({ block: 'nearest' })
      }).catch(function (e) {
        if (btn) btn.disabled = false
        if (msg) msg.innerHTML = '<span class="e-err">' + esc(e) + '</span>'
      })
  }

  // 暂停：先把「我理解成了什么」摆给用户看，再问，再拿答复从此处接着跑
  function paintPause (r) {
    var h = '<div class="h2">需要你确认</div>'
    if (r.finalOutput) h += '<div class="paper">' + esc(r.finalOutput) + '</div>'
    h += '<div class="ask"><div class="q">' + esc(r.pause.question) + '</div>'
    h += '<textarea id="aText" rows="3" placeholder="直接回复，或粘贴作业内容…"></textarea>'
    h += '<div class="ask-btns"><button class="btn" id="btnGo">确认，继续</button>'
    h += '<button class="btn ghost" id="btnBack">改一下开头</button></div></div>'
    h += graphBlock(r)
    $('#runBox').innerHTML = h
    animateGraph(S.lastTrace)
    $('#btnGo').onclick = function () {
      var t = $('#aText').value.trim()
      if (!t) { $('#aText').focus(); return }
      runAgt(r.pause.next, t)
    }
    $('#btnBack').onclick = function () { S.runArgs = null; $('input[data-arg=__goal]').focus(); runAgt() }
  }

  // ══════════ 调用图（SVG）══════════
  //
  // 分层从左到右：层号 = 从入口出发的最长路径。SWF 是 DAG（环已被 ACT-E113 拒掉），
  // 所以最长路径一定收敛；万一拿到一张有环的声明，这里返回 null 让调用方退回文本树——
  // **界面不该在一份坏声明上死循环**。
  function renderGraph (swf, trace) {
    if (!swf || typeof swf !== 'object') return null
    var amzList = (Array.isArray(swf.amz) ? swf.amz : []).filter(function (a) {
      return a && typeof a === 'object' && typeof a.id === 'string'
    })
    var ids = amzList.map(function (a) { return a.id })
    var order = (Array.isArray(swf.order) ? swf.order : []).filter(function (e) { return e && e.from && e.to })
    if (!ids.length || !order.length || ids.length > 120) return null

    var byId = {}
    amzList.forEach(function (a) { byId[a.id] = a })

    // 边：一条 order 展开成「命中边 to」与「兜底边 else」两条可见的线
    var links = []
    order.forEach(function (e) {
      if (byId[e.from] && byId[e.to]) links.push({ from: e.from, to: e.to, kind: 'when', label: e.when, level: e.level })
      if (e.else !== undefined && byId[e.from] && byId[e.else]) {
        var w = order.filter(function (x) { return x.from === e.from && x.else !== undefined })[0]
        links.push({ from: e.from, to: e.else, kind: 'else', label: 'else', level: w ? w.level : undefined })
      }
    })
    if (!links.length) return null

    // ── 分层：Kahn 拓扑 + 最长路径松弛（迭代，不递归）──
    var layer = {}, indeg = {}, out = {}
    ids.forEach(function (id) { layer[id] = 0; indeg[id] = 0; out[id] = [] })
    links.forEach(function (l) { out[l.from].push(l.to); indeg[l.to]++ })
    var q = ids.filter(function (id) { return indeg[id] === 0 })
    var seen = 0
    while (q.length) {
      var n = q.shift(); seen++
      out[n].forEach(function (m) {
        if (layer[m] < layer[n] + 1) layer[m] = layer[n] + 1
        if (--indeg[m] === 0) q.push(m)
      })
    }
    if (seen !== ids.length) return null // 有环 → 交给文本树兜底

    // ── 尺寸与排版（**纵向**分层）──
    // 横向排 11 层要 1400px，容器一裁就只剩前几层，等于没画。
    // 纵排：页面本来就上下滚，流程图也本来就是从上往下读。同层节点左右并排（分支）。
    var term = Array.isArray(swf.terminal) ? swf.terminal : []
    var entries = ids.filter(function (id) { return !links.some(function (l) { return l.to === id }) })
    var entry = entries.length === 1 ? entries[0] : null

    var NH = 42, GY = 34, GX = 26, PAD = 26
    var NW = {}
    ids.forEach(function (id) {
      var a = byId[id] || {}
      var kind = String(a.kind || '')
      NW[id] = Math.max(140, Math.min(212, 34 + id.length * 7.2 + (kind ? kind.length * 6.4 + 14 : 0)))
    })
    var layers = {}
    ids.forEach(function (id) { (layers[layer[id]] = layers[layer[id]] || []).push(id) })
    var rows = Object.keys(layers).map(Number).sort(function (a, b) { return a - b })
    var rowH = {}, rowW = {}
    rows.forEach(function (L) {
      rowH[L] = NH
      var w = 0
      layers[L].forEach(function (id, i) { w += NW[id] + (i ? GX : 0) })
      rowW[L] = w
    })
    var W = Math.max.apply(null, rows.map(function (L) { return rowW[L] })) + PAD * 2
    var H = 0, rowY = {}
    rows.forEach(function (L) { rowY[L] = H; H += NH + GY })
    H -= GY
    H += PAD // 最后一排下面也留白，否则贴着容器边被切

    var pos = {}
    rows.forEach(function (L) {
      var x = (W - rowW[L]) / 2
      layers[L].forEach(function (id) {
        pos[id] = { x: x, y: rowY[L] }
        x += NW[id] + GX
      })
    })

    // ── 轨迹：哪些节点/边走过了 ──
    var doneN = {}, doneE = {}, pausedN = {}
    ;(Array.isArray(trace) ? trace : []).forEach(function (t) {
      if (!t || !t.amz) return
      doneN[t.amz] = 1
      if (t.via === 'pause') pausedN[t.amz] = 1
      if (t.to) doneE[t.amz + '\u0000' + t.to] = 1
    })

    var arrow = 'gArrow', arrowOn = 'gArrowOn'
    var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" ' +
      'xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Consolas,monospace">'
    svg += '<defs>' +
      '<marker id="' + arrow + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0 1 L7 4 L0 7 z" fill="#243044"/></marker>' +
      '<marker id="' + arrowOn + '" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">' +
      '<path d="M0 1 L7 4 L0 7 z" fill="#4cc9f0"/></marker>' +
      '</defs>'

    // 先画边，让节点压在上面
    var showLab = links.length <= 20
    links.forEach(function (l) {
      var a = pos[l.from], b = pos[l.to]
      if (!a || !b) return
      var x1 = a.x + NW[l.from] / 2, y1 = a.y + NH
      var x2 = b.x + NW[l.to] / 2, y2 = b.y
      // 回到同一层或向上（else 指回上层）时，曲线要绕一下，别穿模
      var dy = Math.max(20, Math.abs(y2 - y1) * 0.42)
      var d = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + (y1 + dy) + ' ' + x2 + ' ' + (y2 - dy) + ' ' + x2 + ' ' + y2
      var on = doneE[l.from + '\u0000' + l.to]
      var cls = 'g-edge' + (l.kind === 'else' ? ' else' : '') + (on ? ' done flow' : '')
      svg += '<path class="' + cls + '" d="' + d + '" marker-end="url(#' + (on ? arrowOn : arrow) + ')" data-from="' +
        esc(l.from) + '" data-to="' + esc(l.to) + '"/>'
      if (showLab) {
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - 11
        var lab = l.kind === 'else' ? 'else' : String(l.label === undefined ? '?' : l.label).replace(/\s+/g, ' ')
        if (lab.length > 26) lab = lab.slice(0, 25) + '…'
        // 标签压在曲线上就糊了——给一块底色，宽度按字数估
        var lw = lab.length * 5.7 + 12
        svg += '<rect class="g-labbg" x="' + (mx - lw / 2) + '" y="' + (my - 10) + '" width="' + lw +
          '" height="14" rx="4"/>'
        svg += '<text class="g-lab' + (l.kind === 'else' ? ' else' : '') + (on ? ' on' : '') +
          '" x="' + mx + '" y="' + my + '" text-anchor="middle">' + esc(lab) + '</text>'
      }
    })

    // 再画节点
    ids.forEach(function (id) {
      var p = pos[id]
      if (!p) return
      var a = byId[id] || {}
      var w = NW[id]
      var cls = 'g-node' + (id === entry ? ' entry' : '') + (term.indexOf(id) >= 0 ? ' terminal' : '') +
        (doneN[id] ? ' done' : '') + (pausedN[id] ? ' paused' : '')
      var kind = String(a.kind || '')
      var tools = Array.isArray(a.tools) ? a.tools.length : 0
      var tag = (doneN[id] ? '●' : '○') + (tools ? ' ⚙' + tools : '')
      svg += '<g class="' + cls + '" data-id="' + esc(id) + '">'
      svg += '<rect x="' + p.x + '" y="' + p.y + '" width="' + w + '" height="' + NH + '" rx="9"/>'
      svg += '<circle class="dot" cx="' + (p.x + 15) + '" cy="' + (p.y + NH / 2) + '" r="3"/>'
      svg += '<text class="nid" x="' + (p.x + 26) + '" y="' + (p.y + (kind ? 19 : 25.5)) + '">' + esc(id) + '</text>'
      if (kind) svg += '<text class="kind" x="' + (p.x + 26) + '" y="' + (p.y + 31.5) + '">' + esc(kind) + '</text>'
      svg += '<text class="ntag" x="' + (p.x + w - 11) + '" y="' + (p.y + NH / 2 + 3.5) + '" text-anchor="end">' +
        esc(tag) + '</text>'
      svg += '</g>'
    })

    svg += '</svg>'
    return svg
  }

  function graphLegend () {
    return '<div class="g-legend">' +
      '<span><b></b>未执行</span>' +
      '<span><b class="done"></b>已执行</span>' +
      '<span><b class="pause"></b>在此等你确认</span>' +
      '<span><b class="term"></b>终态</span>' +
      '<span><i></i>when</span>' +
      '<span><i class="else"></i>else</span>' +
      '<span><i class="done"></i>本次走过的边</span>' +
      '</div>'
  }

  // 回放：轨迹是**已经跑完的真实数据**，这里只是按顺序点灯，不是假装在执行
  var _gTimers = []
  function clearGraphTimers () {
    for (var i = 0; i < _gTimers.length; i++) clearTimeout(_gTimers[i])
    _gTimers = []
  }
  function nodeOf (svg, id) {
    var ns = svg.querySelectorAll('.g-node')
    for (var i = 0; i < ns.length; i++) if (ns[i].getAttribute('data-id') === id) return ns[i]
    return null
  }
  function edgeOf (svg, from, to) {
    var es = svg.querySelectorAll('.g-edge')
    for (var i = 0; i < es.length; i++) {
      if (es[i].getAttribute('data-from') === from && es[i].getAttribute('data-to') === to) return es[i]
    }
    return null
  }
  var _gTrace = null
  function applyStep (svg, t) {
    var n = nodeOf(svg, t.amz)
    if (n) { n.classList.add('done'); if (t.via === 'pause') n.classList.add('paused') }
    if (t.to) { var e = edgeOf(svg, t.amz, t.to); if (e) e.classList.add('done', 'flow') }
  }
  function animateGraph (trace) {
    clearGraphTimers()
    var svg = document.querySelector('.graph svg')
    var tr = Array.isArray(trace) ? trace : []
    _gTrace = tr
    if (!svg || !tr.length) return
    var ns = svg.querySelectorAll('.g-node')
    for (var i = 0; i < ns.length; i++) ns[i].classList.remove('done', 'paused')
    var es = svg.querySelectorAll('.g-edge')
    for (var j = 0; j < es.length; j++) es[j].classList.remove('done', 'flow')
    var STEP = 230
    tr.forEach(function (t, k) {
      _gTimers.push(setTimeout(function () { applyStep(svg, t) }, k * STEP))
    })
  }
  // 静态预览要一次到位（出图 / 截图）：**照真实轨迹点亮**，别停在动画中途，
  // 也别图省事把所有节点都点上——那就成了撒谎。
  function finishGraphAnimation () {
    clearGraphTimers()
    var svg = document.querySelector('.graph svg')
    if (!svg || !_gTrace) return
    _gTrace.forEach(function (t) { applyStep(svg, t) })
  }

  // 有图就画图，画不了退回胶囊流（同一份数据，两种呈现）
  function graphBlock (r) {
    var swf = (S.view && S.view.swf) || null
    var svg = null
    var tr = (S.lastTrace && S.lastTrace.length) ? S.lastTrace : (r && r.trace)
    try { svg = renderGraph(swf, tr) } catch (e) { svg = null }
    if (!svg) return traceHtml(r)
    return '<div class="h2">执行轨迹</div><div class="graph">' + svg + '</div>' + graphLegend()
  }

  // 过程画成一行流动的胶囊，而不是每步一行的清单：
  // 十一步就是十一行，太占地。走 else 的边用颜色标出来——那才是要注意的地方。
  function traceHtml (r) {
    var out = []
    for (var i = 0; i < r.trace.length; i++) {
      var s = r.trace[i]
      out.push('<span class="chip' + (i === r.trace.length - 1 ? ' last' : '') + '">' + esc(s.amz) + '</span>')
      if (s.via === 'pause') out.push('<span class="arw pause">⏸ 等你确认</span>')
      else if (s.to) out.push('<span class="arw' + (s.via && s.via.indexOf('else') === 0 ? ' alt' : '') + '">'
        + (s.via && s.via.indexOf('else') === 0 ? '→ else →' : '→') + '</span>')
      else out.push('<span class="arw end">✓</span>')
    }
    return '<div class="h2">过程</div><div class="flow">' + out.join('') + '</div>'
  }

  function paintResult (r) {
    var h = '<div class="h2">结果</div>'
    h += r.ok ? '<div class="e-ok" style="margin-bottom:12px">完成 · ' + r.steps + ' 步</div>'
              : '<div class="e-err" style="margin-bottom:12px">' + esc(r.status) + esc(r.reason ? ' — ' + r.reason : '') + '</div>'
    if (r.finalOutput) h += '<div class="paper">' + esc(r.finalOutput) + '</div>'
    h += graphBlock(r)
    $('#runBox').innerHTML = h
    animateGraph(S.lastTrace)
  }

  function selectAgt (id) {
    var a = null
    for (var i = 0; i < S.agts.length; i++) if (S.agts[i].id === id) a = S.agts[i]
    S.agt = a; S.creating = false; S.panel = null
    if (!a) { paint(); return }
    return api('/api/view?path=' + encodeURIComponent(a.swf) + dirQ())
      .then(function (v) { S.view = v; paint() })
  }

  // ══════════ 开发者模式 ══════════
  function paintDev () {
    var l = S.list || { swfs: [], amz: [] }
    $('#side').innerHTML = '<div class="side-h" style="margin-top:6px">SWF</div>'
      + ((l.swfs && l.swfs.length)
        ? l.swfs.map(function (s) {
          return '<div class="row' + (S.swfPath === s.path ? ' on' : '') + '" data-swf="' + esc(s.path) + '"><span class="nm">' + esc(s.name) + '</span></div>'
        }).join('')
        : '<div class="side-empty">没有 .swf.json</div>')
      + '<div class="side-h">AMZ 库</div>'
      + ((l.amz && l.amz.length)
        ? l.amz.map(function (a) { return '<div class="side-empty" style="padding:3px 11px;text-align:left">' + esc(a.name) + '</div>' }).join('')
        : '<div class="side-empty" style="padding:3px 11px;text-align:left">—</div>')
    $('#sideFoot').innerHTML = '<button class="btn" id="btnRe" style="width:100%">重新读取</button>'
    $('#btnRe').onclick = function () { refreshList().then(paint) }
    if (!S.view || !S.swfPath) {
      $('#view').innerHTML = '<div class="empty"><div style="font-size:15px;font-weight:650;color:var(--fg);margin-bottom:8px">开发者视图</div>'
        + '校验 · 调用顺序图 · AMZ 有效值 · 能力表面<br><span style="font-size:12.5px">从左侧选一张 SWF</span></div>'
      return
    }
    // 试跑：作者改完声明要能**立刻**跑一次，不该被逼着先建一个 AGT 才能验。
    // 这里复用用户模式那套运行表单——同一份实现，不另写一份。
    if (S.devRun) {
      S.agt = {
        id: '__dev__',
        name: dash((S.view.swf && S.view.swf.id) || 'SWF'),
        swf: S.swfPath,
        purpose: ((S.view.swf && S.view.swf.invoke) || {}).when || '',
      }

      return
    }
    renderDev()
  }

  function renderDev () {
    var r = S.view, swf = r.swf || {}
    var amz = Array.isArray(swf.amz) ? swf.amz : []
    var surface = Array.isArray(r.surface) ? r.surface : []
    var ui = swf.ui || {}, inv = swf.invoke || {}
    var errs = r.errors || [], warns = r.warnings || []
    var h = '<div class="page">'
    h += '<p class="title">SWF ' + dash(swf.id) + '</p>'
    h += '<p class="sub">' + esc(r.path) + '</p>'
    h += '<div><span class="pill">v' + dash(swf.version) + '</span><span class="pill">AMZ ' + amz.length + '</span>'
      + '<span class="pill">边 ' + (Array.isArray(swf.order) ? swf.order.length : 0) + '</span>'
      + '<span class="pill">' + (Array.isArray(inv.tags) ? esc(inv.tags.join(' / ')) : '无标签') + '</span></div>'
    h += '<div class="rowline" style="margin-top:16px"><button class="btn" id="btnTryRun">试跑这张 SWF</button>'
      + '<span class="hint">' + (errs.length ? '有 ' + errs.length + ' 个错误，可能跑不通' : '用同一套运行表单，不另建 AGT') + '</span></div>'

    h += '<div class="h2">校验</div>'
    if (!errs.length && !warns.length) h += '<div class="e-ok">通过（0 错误 / 0 警告）</div>'
    else {
      if (errs.length) h += errs.map(function (e) {
        return '<div class="mono e-err" style="margin-bottom:6px">✗ ' + esc(e.code) + '  ' + esc(e.path) + '<br><span style="padding-left:16px">' + esc(e.message) + '</span></div>'
      }).join('')
      if (warns.length) h += warns.map(function (w) {
        return '<div class="mono e-warn" style="margin-bottom:6px">! ' + esc(w.code) + '  ' + esc(w.path) + '<br><span style="padding-left:16px">' + esc(w.message) + '</span></div>'
      }).join('')
    }

    var gsvg = null
    try { gsvg = renderGraph(swf, S.lastTrace) } catch (e2) { gsvg = null }
    h += '<div class="h2">调用图</div>'
    h += gsvg
      ? '<div class="graph">' + gsvg + '</div>' + graphLegend()
      : '<div class="card">' + treeFallback(swf) + '</div>'

    h += '<div class="h2">AMZ（有效值：defaults 已应用，$ref 已解析）</div><div class="card flush">'
    h += '<table><thead><tr><th>id</th><th>kind</th><th>tools</th><th>model</th><th>body</th><th>signal</th></tr></thead><tbody>'
    h += amz.map(function (a) {
      if (!a || typeof a !== 'object') return '<tr><td colspan="6" class="e-err">非法项</td></tr>'
      if (typeof a.$ref === 'string') return '<tr><td class="mono">' + esc(a.$ref) + '</td><td colspan="5" class="hint">引用自 AMZ 库（未解析）</td></tr>'
      var o = a.output || {}, sig = (o.signal && o.signal.fields) ? o.signal.fields : null
      return '<tr><td class="mono">' + esc(a.id) + '</td><td>' + dash(a.kind) + '</td><td class="mono">'
        + ((Array.isArray(a.tools) ? a.tools : []).join(', ') || '—') + '</td><td class="mono">' + dash(a.model) + '</td><td>' + dash(o.body)
        + '</td><td class="mono">' + (sig ? esc(Object.keys(sig).map(function (k) { return k + ':' + sig[k] }).join(' ')) : '—') + '</td></tr>'
    }).join('')
    h += '</tbody></table></div>'

    h += '<div class="h2">能力表面（审查对象）</div><div class="card flush">'
    h += '<table><thead><tr><th>AMZ</th><th>tools</th><th>guards</th></tr></thead><tbody>'
    h += surface.map(function (s) {
      return '<tr><td class="mono">' + esc(s.amz) + '</td><td class="mono">' + ((s.tools || []).join(', ') || '—')
        + '</td><td class="mono">' + ((s.guards || []).join(' | ') || '—') + '</td></tr>'
    }).join('')
    h += '</tbody></table></div>'

    h += '<div class="h2">UI</div><div class="mono hint">page=[' + (Array.isArray(ui.page) ? esc(ui.page.join(', ')) : '') + ']  fallback=' + dash(ui.fallback) + '</div>'
    if (r.surfaceHash) h += '<div class="h2">审查凭据</div><div class="mono hint">' + esc(r.surfaceHash) + '</div>'
    h += '</div>'
    $('#view').innerHTML = h
    var tryRun = $('#btnTryRun')
    if (tryRun) tryRun.onclick = function () { S.devRun = true; paint() }
  }

  function treeFallback (swf) {
    var order = Array.isArray(swf.order) ? swf.order : []
    var adj = {}, targets = {}, froms = []
    order.forEach(function (e) {
      if (!e) return
      if (!adj[e.from]) { adj[e.from] = []; froms.push(e.from) }
      adj[e.from].push(e)
      targets[e.to] = 1
      if (e.else !== undefined) targets[e.else] = 1
    })
    if (!froms.length) return '<div class="hint">这张 SWF 没有边。</div>'
    var terminal = Array.isArray(swf.terminal) ? swf.terminal : []
    var entries = froms.filter(function (n) { return !targets[n] })
    var seen = {}, rows = []
    function walk (n, d) {
      if (seen[n]) { rows.push([d, n + '  (已出现过)', 0]); return }
      seen[n] = 1
      rows.push([d, n + (terminal.indexOf(n) >= 0 ? '  ■ 终态' : ''), 0])
      ;(adj[n] || []).forEach(function (e) {
        var c = (e.when === undefined ? '?' : e.when) + '  (level ' + (e.level === undefined ? '?' : e.level) + ')'
        rows.push([d + 1, '[' + c + '] → ' + e.to, 1])
        if (e.else !== undefined) rows.push([d + 1, '[else] → ' + e.else, 1])
      })
      ;(adj[n] || []).forEach(function (e) {
        if (!seen[e.to]) walk(e.to, d + 2)
        if (e.else !== undefined && !seen[e.else]) walk(e.else, d + 2)
      })
    }
    if (entries.length === 1) walk(entries[0], 0)
    else froms.forEach(function (n) { if (!seen[n]) walk(n, 0) })
    return '<ul class="tree">' + rows.map(function (r) {
      return '<li class="' + (r[2] ? 'edge' : '') + '" style="padding-left:' + (r[0] * 16) + 'px">' + esc(r[1]) + '</li>'
    }).join('') + '</ul>'
  }

      + '<div class="rowline" style="margin-top:16px"><button class="btn primary" id="setSave">保存</button>'
      + '<span class="hint" id="setMsg"></span></div></div>'
      + '</div>'

    $('#mSave').onclick = function () {

      var be = b.getAttribute('data-be')
      if (be === 'http' && !(S.settings.model && S.settings.model.hasKey)) {

      }

    if (mc) mc.onclick = function () {

    $('#setSave').onclick = function () {

  // ══════════ 事件 ══════════
  document.addEventListener('click', function (ev) {
    var t = ev.target
    var chip = t.closest && t.closest('[data-chip]')
    if (chip) { var i = $('#askInput'); if (i) { i.value = chip.getAttribute('data-chip'); ask() } return }

    var mb = t.closest && t.closest('#modes button')
    if (mb) { S.mode = mb.getAttribute('data-mode'); S.panel = null; S.creating = false; S.devRun = false; saveSettings({ mode: S.mode }); paint(); return }

    var del = t.closest && t.closest('[data-del]')
    if (del) {
      ev.stopPropagation()
      var id = del.getAttribute('data-del')
      if (confirm('删除这个 AGT？')) {
        post('/api/agts?id=' + encodeURIComponent(id), {}, 'DELETE').then(function () {
          if (S.agt && S.agt.id === id) { S.agt = null; S.view = null }
          return refreshAgts().then(paint)
        })
      }
      return
    }

    var ag = t.closest && t.closest('[data-agt]')
    if (ag) { selectAgt(ag.getAttribute('data-agt')); return }

    var sw = t.closest && t.closest('[data-swf]')
    if (sw) {
      S.swfPath = sw.getAttribute('data-swf')
      S.devRun = false // 换一张 SWF 就回到校验视图，别停在上一张的试跑结果上
      api('/api/view?path=' + encodeURIComponent(S.swfPath) + dirQ()).then(function (v) { S.view = v; paint() })
    }
  })

  $('#btnSettings').onclick = function () { S.panel = S.panel === 'settings' ? null : 'settings'; paint() }

  boot()
})()
</script>
</body>
</html>
